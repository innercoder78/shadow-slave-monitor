name: Scheduled public source diagnostics

on:
  schedule:
    - cron: '17 3,15 * * *'
  workflow_dispatch:
    inputs:
      reference_chapter:
        description: Optional independently confirmed chapter for jump checks
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out execution snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r dependencies/requirements.lock

      - name: Observe disabled sources without side effects
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          PYTHONDONTWRITEBYTECODE: "1"
          DIAGNOSTIC_RUNNER_LABEL: ubuntu-26.04
          DIAGNOSTIC_CHECKOUT_SHA: ${{ github.sha }}
          DIAGNOSTIC_MODE: inactive_sources
          DIAGNOSTIC_REFERENCE_CHAPTER: ${{ github.event_name == 'workflow_dispatch' && inputs.reference_chapter || '' }}
        run: python -m shadow_slave_monitor.diagnose_runner
