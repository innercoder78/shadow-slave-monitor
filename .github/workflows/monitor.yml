name: Shadow Slave chapter monitor

on:
  workflow_dispatch:
    inputs:
      force_webnovel_check:
        description: "Force a WebNovel check even outside the scheduled UTC check window"
        required: false
        default: false
        type: boolean

concurrency:
  group: shadow-slave-monitor-workflow
  cancel-in-progress: false
  queue: max

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      result: ${{ steps.result.outputs.result }}
    steps:
      - name: Check out repository
        # Pinned to an immutable commit SHA.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Synchronize checker checkout
        run: |
          git fetch --depth=1 origin main
          git reset --hard origin/main
          git status --porcelain=v1
          test -z "$(git status --porcelain=v1)"

      - name: Set up Python
        # Pinned to an immutable commit SHA.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --require-hashes -r dependencies/requirements.lock

      - name: Record base state metadata
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/shadow-slave-monitor-state-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p "$ARTIFACT_DIR"
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          state_path = Path('state/state.json')
          artifact_dir = Path(os.environ['ARTIFACT_DIR'])
          metadata = {
              "artifact_type": "monitor",
              "state_file": "state/state.json",
              "base_sha256": hashlib.sha256(state_path.read_bytes()).hexdigest(),
              "checkout_sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
          }
          (artifact_dir / 'state_artifact_metadata.json').write_text(json.dumps(metadata, indent=2) + "\n", encoding='utf-8')
          PY

      - name: Verify checker checkout is current before side effects
        run: |
          git fetch --depth=1 origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git status --porcelain=v1
          test -z "$(git status --porcelain=v1)"

      - name: Run monitor
        id: run_monitor
        continue-on-error: true
        env:
          NTFY_NEWCHAPTER: ${{ secrets.NTFY_NEWCHAPTER }}
          PYTHONPATH: ${{ github.workspace }}/src
          SHADOW_SLAVE_FORCE_WEBNOVEL_CHECK: ${{ inputs.force_webnovel_check && 'true' || 'false' }}
          SHADOW_SLAVE_MONITOR_RESULT_PATH: ${{ runner.temp }}/shadow-slave-monitor-state-${{ github.run_id }}-${{ github.run_attempt }}/run_result.json
        run: python -m shadow_slave_monitor.monitor

      - name: Capture monitor result
        id: result
        if: always()
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/shadow-slave-monitor-state-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p "$ARTIFACT_DIR"
          if [ -f "$ARTIFACT_DIR/run_result.json" ]; then
            result=$(python -c 'import json, os; print(json.load(open(os.path.join(os.environ["ARTIFACT_DIR"], "run_result.json"), encoding="utf-8")).get("result", "failed"))')
          else
            result=failed
            printf '{"result":"failed","reasons":["monitor did not produce run_result.json"],"degraded_reasons":[]}\n' > "$ARTIFACT_DIR/run_result.json"
          fi
          cp state/state.json "$ARTIFACT_DIR/state.json"
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Upload validated state artifact
        if: always()
        # Pinned to an immutable commit SHA.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: monitor-state
          path: |
            ${{ runner.temp }}/shadow-slave-monitor-state-${{ github.run_id }}-${{ github.run_attempt }}/state.json
            ${{ runner.temp }}/shadow-slave-monitor-state-${{ github.run_id }}-${{ github.run_attempt }}/run_result.json
            ${{ runner.temp }}/shadow-slave-monitor-state-${{ github.run_id }}-${{ github.run_attempt }}/state_artifact_metadata.json
          if-no-files-found: error
          retention-days: 1

  state-writer:
    needs: monitor
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: shadow-slave-state-writer
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check out repository
        # Pinned to an immutable commit SHA.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main

      - name: Update to latest main
        run: git pull --ff-only origin main

      - name: Download monitor state artifact
        # Pinned to an immutable commit SHA.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: monitor-state
          path: ${{ runner.temp }}/shadow-slave-monitor-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Validate, version-check, and persist monitor state
        run: python scripts/state_writer.py --artifact-dir "${{ runner.temp }}/shadow-slave-monitor-state-${{ github.run_id }}-${{ github.run_attempt }}" state/state.json

      - name: Remove downloaded monitor artifact
        if: always()
        run: rm -rf -- "${{ runner.temp }}/shadow-slave-monitor-state-${{ github.run_id }}-${{ github.run_attempt }}"

