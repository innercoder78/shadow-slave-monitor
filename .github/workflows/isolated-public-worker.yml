name: Isolated public evidence worker

on:
  workflow_run:
    workflows: [Shadow Slave chapter monitor]
    types: [in_progress]
    branches: [main]

# Deliberately outside the monitor's workflow concurrency group: an optional
# queued runner must never occupy that group and delay an authority check.
# This workflow only produces evidence for its exact parent run/attempt.
permissions:
  contents: read

jobs:
  isolated-public-sources:
    if: >-
      github.event.workflow_run.path == '.github/workflows/monitor.yml' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 4
    steps:
      - name: Check out parent execution snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r dependencies/requirements.lock

      - name: Check isolated public sources without side effects
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          SHADOW_SLAVE_ISOLATED_RUNNER: ubuntu-26.04
          SHADOW_SLAVE_PARENT_RUN_ID: ${{ github.event.workflow_run.id }}
          SHADOW_SLAVE_PARENT_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SHADOW_SLAVE_PARENT_SHA: ${{ github.event.workflow_run.head_sha }}
          SHADOW_SLAVE_ISOLATED_OUTPUT: ${{ runner.temp }}/isolated-public/evidence.json
        run: python -m shadow_slave_monitor.isolated_worker

      - name: Upload bounded public evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: isolated-public-evidence-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/isolated-public/evidence.json
          if-no-files-found: ignore
          retention-days: 1
