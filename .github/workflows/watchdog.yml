name: Shadow Slave monitor watchdog

on:
  schedule:
    - cron: "17 0-21/3 * * *"
    - cron: "47 1-22/3 * * *"
  workflow_dispatch:

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        # actions/checkout v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v6
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Run watchdog
        env:
          NTFY_ERROR_TOPIC: ${{ secrets.NTFY_ERROR_TOPIC }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python watchdog.py

      - name: Upload watchdog state artifact
        if: always()
        # actions/upload-artifact v4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: watchdog-state
          path: |
            watchdog_state.json
            watchdog_result.json
          if-no-files-found: error
          retention-days: 1

  state-writer:
    needs: watchdog
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: shadow-slave-state-writer
      cancel-in-progress: false
    steps:
      - name: Check out repository
        # actions/checkout v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: main

      - name: Download watchdog state artifact
        # actions/download-artifact v4
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: watchdog-state
          path: .state-artifact

      - name: Apply meaningful watchdog state if changed
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          result = json.loads(Path('.state-artifact/watchdog_result.json').read_text(encoding='utf-8'))
          if not isinstance(result, dict):
              raise SystemExit('watchdog_result.json must be an object')
          if result.get('changed'):
              data = json.loads(Path('.state-artifact/watchdog_state.json').read_text(encoding='utf-8'))
              if not isinstance(data, dict):
                  raise SystemExit('watchdog_state.json must be an object')
              shutil.copyfile('.state-artifact/watchdog_state.json', 'watchdog_state.json')
          PY
          rm -rf .state-artifact

      - name: Commit permitted watchdog state changes
        run: python scripts/state_writer.py watchdog_state.json
