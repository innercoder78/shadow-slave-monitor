name: Shadow Slave monitor watchdog

on:
  schedule:
    - cron: "37 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shadow-slave-monitor-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run watchdog
        env:
          NTFY_ERROR_TOPIC: ${{ secrets.NTFY_ERROR_TOPIC }}
        run: python watchdog.py

      - name: Commit watchdog state changes
        run: |
          if git diff --quiet -- watchdog_state.json; then
            echo "watchdog_state.json unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watchdog_state.json
          git commit -m "Update watchdog state"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            sleep 5
          done
          echo "Failed to push watchdog_state.json after 3 attempts."
          exit 1
