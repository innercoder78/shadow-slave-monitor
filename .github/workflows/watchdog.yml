name: Shadow Slave monitor watchdog

on:
  schedule:
    - cron: "17 0-21/3 * * *"
    - cron: "47 1-22/3 * * *"
  workflow_dispatch:

concurrency:
  group: shadow-slave-watchdog-workflow
  cancel-in-progress: false
  queue: max

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        # actions/checkout v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Synchronize latest main before reading state
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          git reset --hard origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test -z "$(git status --porcelain=v1)"

      - name: Set up Python
        # actions/setup-python v6
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --require-hashes -r dependencies/requirements.lock

      - name: Prepare runner-temporary artifact staging
        env:
          STAGING_DIR: ${{ runner.temp }}/shadow-slave-watchdog-staging-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          rm -rf -- "$STAGING_DIR"
          mkdir -p -- "$STAGING_DIR"
          echo "SHADOW_SLAVE_WATCHDOG_STAGING_DIR=$STAGING_DIR" >> "$GITHUB_ENV"
          echo "SHADOW_SLAVE_WATCHDOG_RESULT_PATH=$STAGING_DIR/watchdog_result.json" >> "$GITHUB_ENV"

      - name: Record base state metadata
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          staging = Path(os.environ["SHADOW_SLAVE_WATCHDOG_STAGING_DIR"])
          state_path = Path('state/watchdog_state.json')
          metadata = {
              "artifact_type": "watchdog",
              "state_file": "state/watchdog_state.json",
              "base_sha256": hashlib.sha256(state_path.read_bytes()).hexdigest(),
              "checkout_sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
          }
          (staging / 'state_artifact_metadata.json').write_text(json.dumps(metadata, indent=2) + "\n", encoding='utf-8')
          PY

      - name: Verify latest main before watchdog side effects
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test -z "$(git status --porcelain=v1)"

      - name: Run watchdog
        env:
          NTFY_ERROR_TOPIC: ${{ secrets.NTFY_ERROR_TOPIC }}
          GITHUB_TOKEN: ${{ github.token }}
        run: PYTHONPATH="$GITHUB_WORKSPACE/src" python -m shadow_slave_monitor.watchdog

      - name: Stage watchdog artifact files
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f "$SHADOW_SLAVE_WATCHDOG_RESULT_PATH" ]; then
            printf '{"changed":false,"status":"failed","error_type":"MissingResult"}\n' > "$SHADOW_SLAVE_WATCHDOG_RESULT_PATH"
          fi
          cp state/watchdog_state.json "$SHADOW_SLAVE_WATCHDOG_STAGING_DIR/watchdog_state.json"

      - name: Upload watchdog state artifact
        if: always()
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: watchdog-state
          path: |
            ${{ env.SHADOW_SLAVE_WATCHDOG_STAGING_DIR }}/watchdog_state.json
            ${{ env.SHADOW_SLAVE_WATCHDOG_STAGING_DIR }}/watchdog_result.json
            ${{ env.SHADOW_SLAVE_WATCHDOG_STAGING_DIR }}/state_artifact_metadata.json
          if-no-files-found: error
          retention-days: 1

  state-writer:
    needs: watchdog
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: shadow-slave-state-writer
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check out repository
        # actions/checkout v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: main

      - name: Synchronize latest main before writing state
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test -z "$(git status --porcelain=v1)"

      - name: Download watchdog state artifact
        # actions/download-artifact v4
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: watchdog-state
          path: ${{ runner.temp }}/shadow-slave-watchdog-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Validate, version-check, and persist watchdog state
        run: python scripts/state_writer.py --artifact-dir "${{ runner.temp }}/shadow-slave-watchdog-state-${{ github.run_id }}-${{ github.run_attempt }}" state/watchdog_state.json

      - name: Remove downloaded watchdog artifact
        if: always()
        run: rm -rf -- "${{ runner.temp }}/shadow-slave-watchdog-state-${{ github.run_id }}-${{ github.run_attempt }}"
