name: Shadow Slave monitor watchdog

on:
  schedule:
    - cron: "17 0-21/3 * * *"
    - cron: "47 1-22/3 * * *"
  workflow_dispatch:

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        # actions/checkout v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v6
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Record base state metadata
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          state_path = Path('watchdog_state.json')
          metadata = {
              "artifact_type": "watchdog",
              "state_file": "watchdog_state.json",
              "base_sha256": hashlib.sha256(state_path.read_bytes()).hexdigest(),
              "checkout_sha": os.environ["GITHUB_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
          }
          Path('state_artifact_metadata.json').write_text(json.dumps(metadata, indent=2) + "\n", encoding='utf-8')
          PY

      - name: Run watchdog
        env:
          NTFY_ERROR_TOPIC: ${{ secrets.NTFY_ERROR_TOPIC }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python watchdog.py

      - name: Upload watchdog state artifact
        if: always()
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: watchdog-state
          path: |
            watchdog_state.json
            watchdog_result.json
            state_artifact_metadata.json
          if-no-files-found: error
          retention-days: 1

  state-writer:
    needs: watchdog
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: shadow-slave-state-writer
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check out repository
        # actions/checkout v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: main

      - name: Update to latest main
        run: git pull --ff-only origin main

      - name: Download watchdog state artifact
        # actions/download-artifact v4
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: watchdog-state
          path: .state-artifact

      - name: Validate, version-check, and persist watchdog state
        run: python scripts/state_writer.py --artifact-dir .state-artifact watchdog_state.json

      - name: Remove downloaded watchdog artifact
        if: always()
        run: rm -rf .state-artifact
