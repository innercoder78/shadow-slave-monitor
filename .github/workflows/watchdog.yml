name: Shadow Slave monitor watchdog

on:
  schedule:
    - cron: "17 0-21/3 * * *"
    - cron: "47 1-22/3 * * *"
  workflow_dispatch:

concurrency:
  group: shadow-slave-watchdog-workflow
  cancel-in-progress: false
  queue: max

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        # Pinned to an immutable commit SHA.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Synchronize checker checkout
        run: |
          git fetch --depth=1 origin main
          git reset --hard origin/main
          git status --porcelain=v1
          test -z "$(git status --porcelain=v1)"

      - name: Set up Python
        # Pinned to an immutable commit SHA.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --require-hashes -r dependencies/requirements.lock

      - name: Record base state metadata
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/shadow-slave-watchdog-state-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p "$ARTIFACT_DIR"
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          state_path = Path('state/watchdog_state.json')
          artifact_dir = Path(os.environ['ARTIFACT_DIR'])
          metadata = {
              "artifact_type": "watchdog",
              "state_file": "state/watchdog_state.json",
              "base_sha256": hashlib.sha256(state_path.read_bytes()).hexdigest(),
              "checkout_sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
          }
          (artifact_dir / 'state_artifact_metadata.json').write_text(json.dumps(metadata, indent=2) + "\n", encoding='utf-8')
          PY

      - name: Verify checker checkout is current before side effects
        run: |
          git fetch --depth=1 origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git status --porcelain=v1
          test -z "$(git status --porcelain=v1)"

      - name: Run watchdog
        env:
          NTFY_ERROR_TOPIC: ${{ secrets.NTFY_ERROR_TOPIC }}
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/src
          SHADOW_SLAVE_WATCHDOG_RESULT_PATH: ${{ runner.temp }}/shadow-slave-watchdog-state-${{ github.run_id }}-${{ github.run_attempt }}/watchdog_result.json
        run: python -m shadow_slave_monitor.watchdog

      - name: Stage watchdog artifact state
        if: always()
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/shadow-slave-watchdog-state-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p "$ARTIFACT_DIR"
          if [ ! -f "$ARTIFACT_DIR/watchdog_result.json" ]; then
            printf '{"changed":false,"status":"failed","error_type":"watchdog result missing"}\n' > "$ARTIFACT_DIR/watchdog_result.json"
          fi
          cp state/watchdog_state.json "$ARTIFACT_DIR/watchdog_state.json"

      - name: Upload watchdog state artifact
        if: always()
        # Pinned to an immutable commit SHA.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: watchdog-state
          path: |
            ${{ runner.temp }}/shadow-slave-watchdog-state-${{ github.run_id }}-${{ github.run_attempt }}/watchdog_state.json
            ${{ runner.temp }}/shadow-slave-watchdog-state-${{ github.run_id }}-${{ github.run_attempt }}/watchdog_result.json
            ${{ runner.temp }}/shadow-slave-watchdog-state-${{ github.run_id }}-${{ github.run_attempt }}/state_artifact_metadata.json
          if-no-files-found: error
          retention-days: 1

  state-writer:
    needs: watchdog
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: shadow-slave-state-writer
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check out repository
        # Pinned to an immutable commit SHA.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main

      - name: Update to latest main
        run: git pull --ff-only origin main

      - name: Download watchdog state artifact
        # Pinned to an immutable commit SHA.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: watchdog-state
          path: ${{ runner.temp }}/shadow-slave-watchdog-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Validate, version-check, and persist watchdog state
        run: python scripts/state_writer.py --artifact-dir "${{ runner.temp }}/shadow-slave-watchdog-state-${{ github.run_id }}-${{ github.run_attempt }}" state/watchdog_state.json

      - name: Remove downloaded watchdog artifact
        if: always()
        run: rm -rf -- "${{ runner.temp }}/shadow-slave-watchdog-state-${{ github.run_id }}-${{ github.run_attempt }}"
