name: Runner compatibility diagnostics

on:
  workflow_dispatch:
    inputs:
      diagnostic_mode:
        description: Isolated diagnostic to compare on both runners
        type: choice
        required: true
        default: core
        options:
          - core
          - inactive_sources

permissions:
  contents: read

jobs:
  compare:
    name: Compare (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - name: Check out dispatch snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r dependencies/requirements.lock

      - name: Compare independent source checks without side effects
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          PYTHONDONTWRITEBYTECODE: "1"
          DIAGNOSTIC_RUNNER_LABEL: ${{ matrix.runner }}
          DIAGNOSTIC_CHECKOUT_SHA: ${{ github.sha }}
          DIAGNOSTIC_MODE: ${{ inputs.diagnostic_mode }}
        run: python -m shadow_slave_monitor.diagnose_runner
